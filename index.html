<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="google-site-verification" content="wuNAgSkbNTqaeE3mYXYoRor9HgIp64YeCOrIIOpI5kQ" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Digital Pulse - Gaming & Tech News</title>
    <style>
        :root {
            --bg-color: #0f111a;
            --card-bg: #1e2235;
            --accent-color: #ff4757;
            --text-color: #ffffff;
            --text-muted: #a0a5c0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        header {
            text-align: center;
            padding: 40px 0;
            border-bottom: 2px solid var(--card-bg);
        }
        header h1 {
            color: var(--accent-color);
            margin: 0;
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        header p {
            color: var(--text-muted);
            margin-top: 10px;
        }
        .container {
            max-width: 1200px;
            margin: 40px auto;
        }
        .news-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
        }
        .news-card {
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: transform 0.3s ease, border-color 0.3s ease;
            border: 1px solid transparent;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .news-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-color);
        }
        .news-card h3 {
            margin-top: 0;
            font-size: 1.3rem;
            line-height: 1.4;
        }
        .news-card a {
            color: var(--text-color);
            text-decoration: none;
        }
        .news-card a:hover {
            color: var(--accent-color);
        }
        .meta-info {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .btn {
            display: inline-block;
            background-color: var(--accent-color);
            color: white;
            padding: 8px 15px;
            border-radius: 4px;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: bold;
            text-align: center;
            margin-top: 15px;
        }
        .loading {
            text-align: center;
            font-size: 1.2rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <header>
        <h1>Daily Digital Pulse</h1>
        <p>Your Ultimate Stop for Live Gaming & Media Updates</p>
    </header>

    <div class="container">
        <div id="loading" class="loading">Fetching latest pulse...</div>
        <div id="news-grid" class="news-grid"></div>
    </div>

    <script>
        const owner = 'DailyDigitalPulse';
        const repo = 'index';
        const branch = 'main';

        async function fetchPosts() {
            try {
                const response = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents?ref=${branch}`);
                const files = await response.json();
                const grid = document.getElementById('news-grid');
                document.getElementById('loading').style.display = 'none';

                // Filter out non-html files and index.html itself
                const posts = files.filter(file => file.name.endsWith('.html') && file.name !== 'index.html');

                if(posts.length === 0) {
                    grid.innerHTML = '<p class="loading">No posts found yet.</p>';
                    return;
                }

                // Reverse to show newest first
                posts.reverse().forEach(post => {
                    // Create clean Title from filename
                    let cleanTitle = post.name.replace('.html', '').replace(/-/g, ' ');
                    if(cleanTitle.length > 75) cleanTitle = cleanTitle.substring(0, 75) + '...';

                    const card = document.createElement('div');
                    card.className = 'news-card';
                    card.innerHTML = `
                        <div>
                            <h3><a href="${post.path}">${cleanTitle}</a></h3>
                        </div>
                        <div>
                            <div class="meta-info">
                                <span>🎮 Gaming News</span>
                            </div>
                            <a href="${post.path}" class="btn">Read Article</a>
                        </div>
                    `;
                    grid.appendChild(card);
                });

            } catch (error) {
                console.error('Error fetching repo contents:', error);
                document.getElementById('loading').innerText = 'Failed to load posts. Refresh the page.';
            }
        }

        fetchPosts();
    </script>
</body>
</html>
